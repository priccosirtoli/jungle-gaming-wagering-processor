services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Pinned: newer LocalStack images require an auth token.
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wagering-events >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # One-shot migration job, so scaled app replicas never race on migrations.
  migrate:
    build: .
    command: ["bun", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_NAME: wagering-events
    # A port range so `--scale app=3` works: each replica gets its own host port.
    ports:
      - "3000-3005:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    profiles: ["app"]
